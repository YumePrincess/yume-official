<!doctype html>
<html lang="en" data-yume-error-page>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4edf8">
  <title>Page not found · Yume Official</title>
  <script>
    (function () {
      function readCookie(name) {
        var prefix = name + '=';
        var parts = document.cookie ? document.cookie.split(';') : [];

        for (var index = 0; index < parts.length; index += 1) {
          var part = parts[index].trim();
          if (part.indexOf(prefix) !== 0) continue;

          try {
            return decodeURIComponent(part.slice(prefix.length));
          } catch (error) {
            return part.slice(prefix.length);
          }
        }

        return '';
      }

      var theme = readCookie('yume-preference-theme');
      if (!theme) {
        try {
          theme = localStorage.getItem('yume-theme') || '';
        } catch (error) {}
      }

      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --page-background: #f7f2fa;
      --page-background-deep: #eee4f4;
      --card-background: rgba(255, 255, 255, 0.68);
      --card-border: rgba(255, 255, 255, 0.82);
      --text-primary: #292332;
      --text-secondary: #6d6476;
      --accent: #9b7fc5;
      --accent-strong: #7456a2;
      --accent-soft: rgba(155, 127, 197, 0.15);
      --shadow: rgba(80, 57, 105, 0.16);
      --button-text: #fff;
      --orb-one: rgba(220, 186, 235, 0.72);
      --orb-two: rgba(188, 208, 242, 0.7);
      --orb-three: rgba(247, 210, 223, 0.64);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page-background: #17131e;
        --page-background-deep: #0f0c14;
        --card-background: rgba(35, 28, 45, 0.7);
        --card-border: rgba(255, 255, 255, 0.12);
        --text-primary: #f6effb;
        --text-secondary: #b8adbf;
        --accent: #c5a9ec;
        --accent-strong: #dbc7f6;
        --accent-soft: rgba(197, 169, 236, 0.13);
        --shadow: rgba(0, 0, 0, 0.4);
        --button-text: #211829;
        --orb-one: rgba(112, 75, 139, 0.44);
        --orb-two: rgba(66, 90, 132, 0.42);
        --orb-three: rgba(130, 74, 99, 0.34);
      }
    }

    html[data-theme="light"] {
      color-scheme: light;
      --page-background: #f7f2fa;
      --page-background-deep: #eee4f4;
      --card-background: rgba(255, 255, 255, 0.68);
      --card-border: rgba(255, 255, 255, 0.82);
      --text-primary: #292332;
      --text-secondary: #6d6476;
      --accent: #9b7fc5;
      --accent-strong: #7456a2;
      --accent-soft: rgba(155, 127, 197, 0.15);
      --shadow: rgba(80, 57, 105, 0.16);
      --button-text: #fff;
      --orb-one: rgba(220, 186, 235, 0.72);
      --orb-two: rgba(188, 208, 242, 0.7);
      --orb-three: rgba(247, 210, 223, 0.64);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-background: #17131e;
      --page-background-deep: #0f0c14;
      --card-background: rgba(35, 28, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f6effb;
      --text-secondary: #b8adbf;
      --accent: #c5a9ec;
      --accent-strong: #dbc7f6;
      --accent-soft: rgba(197, 169, 236, 0.13);
      --shadow: rgba(0, 0, 0, 0.4);
      --button-text: #211829;
      --orb-one: rgba(112, 75, 139, 0.44);
      --orb-two: rgba(66, 90, 132, 0.42);
      --orb-three: rgba(130, 74, 99, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: clamp(20px, 4vw, 56px);
      color: var(--text-primary);
      background:
        radial-gradient(circle at 18% 20%, var(--orb-one), transparent 34%),
        radial-gradient(circle at 83% 18%, var(--orb-two), transparent 32%),
        radial-gradient(circle at 72% 84%, var(--orb-three), transparent 35%),
        linear-gradient(145deg, var(--page-background), var(--page-background-deep));
      font-family: Inter, ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    }

    .ambient {
      position: fixed;
      z-index: 0;
      width: min(48vw, 540px);
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 48% 52% 64% 36% / 52% 42% 58% 48%;
      opacity: 0.55;
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .ambient.one {
      top: -28%;
      right: -12%;
      rotate: 18deg;
    }

    .ambient.two {
      bottom: -36%;
      left: -15%;
      rotate: -28deg;
      animation-delay: -8s;
    }

    .error-card {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      padding: clamp(28px, 6vw, 62px);
      overflow: hidden;
      border: 1px solid var(--card-border);
      border-radius: clamp(28px, 5vw, 46px);
      background: var(--card-background);
      box-shadow: 0 30px 90px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      text-align: center;
      backdrop-filter: blur(28px) saturate(135%);
      -webkit-backdrop-filter: blur(28px) saturate(135%);
    }

    .error-card::before {
      position: absolute;
      inset: 0;
      background: linear-gradient(132deg, rgba(255, 255, 255, 0.2), transparent 36%, var(--accent-soft));
      content: "";
      pointer-events: none;
    }

    .brand {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.46), var(--accent-soft));
      box-shadow: 0 10px 25px var(--shadow);
      color: var(--accent-strong);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-style: italic;
    }

    .brand-copy {
      display: grid;
      justify-items: start;
      line-height: 1.15;
    }

    .brand-copy strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .brand-copy span {
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .error-code {
      position: relative;
      margin: -8px 0 -12px;
      color: transparent;
      background: linear-gradient(120deg, var(--accent-strong), color-mix(in srgb, var(--accent) 42%, #d9b5ca));
      background-clip: text;
      -webkit-background-clip: text;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(92px, 22vw, 170px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -0.08em;
      line-height: 0.82;
      text-shadow: 0 18px 42px var(--shadow);
    }

    .eyebrow {
      position: relative;
      margin: 28px 0 10px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(29px, 6vw, 48px);
      font-weight: 680;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    .description {
      position: relative;
      max-width: 510px;
      margin: 18px auto 0;
      color: var(--text-secondary);
      font-size: clamp(15px, 2.5vw, 18px);
      line-height: 1.75;
    }

    .request-path {
      position: relative;
      display: flex;
      max-width: 510px;
      align-items: center;
      gap: 10px;
      margin: 24px auto 0;
      padding: 11px 15px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      border-radius: 15px;
      background: var(--accent-soft);
      color: var(--text-secondary);
      font-size: 12px;
      text-align: left;
    }

    .request-path span {
      flex: none;
      font-weight: 650;
    }

    .request-path code {
      min-width: 0;
      overflow: hidden;
      color: var(--text-primary);
      font: inherit;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      min-height: 48px;
      padding: 13px 21px;
      border: 1px solid color-mix(in srgb, var(--accent) 27%, transparent);
      border-radius: 16px;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 24px rgba(55, 41, 72, 0.08);
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      line-height: 20px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .button.primary {
      border-color: transparent;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 16px 30px var(--shadow);
    }

    .button:focus-visible,
    .brand:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 48%, transparent);
      outline-offset: 4px;
    }

    .button[hidden] {
      display: none;
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(24px, -18px, 0) scale(1.06); }
    }

    @media (max-width: 520px) {
      body {
        align-items: stretch;
        overflow: auto;
        padding: 14px;
      }

      .error-card {
        align-self: center;
        padding: 30px 22px 26px;
        border-radius: 30px;
      }

      .brand {
        margin-bottom: 26px;
      }

      .actions {
        display: grid;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient one" aria-hidden="true"></div>
  <div class="ambient two" aria-hidden="true"></div>

  <main class="error-card">
    <a class="brand" id="brand-link" href="/" aria-label="Yume Official">
      <span class="brand-mark" aria-hidden="true">Y</span>
      <span class="brand-copy">
        <strong>yume.zone</strong>
        <span id="site-label">Yume Official</span>
      </span>
    </a>

    <div class="error-code" aria-hidden="true">404</div>
    <p class="eyebrow" id="error-eyebrow">Lost between dreams</p>
    <h1 id="error-title">This page could not be found</h1>
    <p class="description" id="error-description">
      The address may have changed, or the page may no longer exist.
    </p>

    <p class="request-path">
      <span id="path-label">Requested path</span>
      <code id="request-path">/</code>
    </p>

    <div class="actions">
      <a class="button primary" id="home-link" href="/">Return to Yume Official</a>
      <button class="button" id="back-button" type="button">Go back</button>
    </div>
  </main>

  <script>
    (function () {
      var supportedLanguages = ['en', 'fr', 'ja', 'zh-cn', 'zh-tw'];
      var translations = {
        en: {
          eyebrow: 'Lost between dreams',
          title: 'This page could not be found',
          description: 'The address may have changed, or the page may no longer exist.',
          path: 'Requested path',
          home: 'Return to {site}',
          back: 'Go back',
          pageTitle: 'Page not found'
        },
        fr: {
          eyebrow: 'Égaré entre deux rêves',
          title: 'Cette page est introuvable',
          description: 'Son adresse a peut-être changé, ou cette page n’existe plus.',
          path: 'Chemin demandé',
          home: 'Retour à {site}',
          back: 'Retour',
          pageTitle: 'Page introuvable'
        },
        ja: {
          eyebrow: '夢の途中で迷いました',
          title: 'ページが見つかりません',
          description: 'アドレスが変更されたか、ページが存在しない可能性があります。',
          path: 'リクエストされたパス',
          home: '{site} に戻る',
          back: '前のページへ',
          pageTitle: 'ページが見つかりません'
        },
        'zh-cn': {
          eyebrow: '迷失在梦境之间',
          title: '没有找到这个页面',
          description: '地址可能已经改变，或这个页面已不再存在。',
          path: '请求路径',
          home: '返回 {site}',
          back: '返回上一页',
          pageTitle: '页面未找到'
        },
        'zh-tw': {
          eyebrow: '迷失在夢境之間',
          title: '找不到這個頁面',
          description: '網址可能已經變更，或這個頁面已不再存在。',
          path: '請求路徑',
          home: '返回 {site}',
          back: '返回上一頁',
          pageTitle: '找不到頁面'
        }
      };

      function readCookie(name) {
        var prefix = name + '=';
        var parts = document.cookie ? document.cookie.split(';') : [];

        for (var index = 0; index < parts.length; index += 1) {
          var part = parts[index].trim();
          if (part.indexOf(prefix) !== 0) continue;

          try {
            return decodeURIComponent(part.slice(prefix.length));
          } catch (error) {
            return part.slice(prefix.length);
          }
        }

        return '';
      }

      function readStorage(name) {
        try {
          return localStorage.getItem(name) || '';
        } catch (error) {
          return '';
        }
      }

      function normalizeLanguage(value) {
        var language = String(value || '').trim().toLowerCase().replace(/_/g, '-');

        if (
          language.indexOf('zh-tw') === 0 ||
          language.indexOf('zh-hk') === 0 ||
          language.indexOf('zh-mo') === 0 ||
          language.indexOf('zh-hant') === 0
        ) {
          return 'zh-tw';
        }

        if (
          language === 'zh' ||
          language.indexOf('zh-cn') === 0 ||
          language.indexOf('zh-sg') === 0 ||
          language.indexOf('zh-hans') === 0
        ) {
          return 'zh-cn';
        }

        var shortLanguage = language.slice(0, 2);
        return supportedLanguages.indexOf(shortLanguage) >= 0 ? shortLanguage : '';
      }

      function readLanguageQuery() {
        var search = new URLSearchParams(location.search);
        var result = '';

        search.forEach(function (value, key) {
          if (!result && key.toLowerCase() === 'lang') result = value;
        });

        return result;
      }

      function resolveLanguage() {
        var choice = readLanguageQuery() ||
          readCookie('yume-preference-language') ||
          readStorage('lang') ||
          'auto';
        var explicit = normalizeLanguage(choice);
        if (String(choice).toLowerCase() !== 'auto' && explicit) return explicit;

        var browserLanguages = Array.isArray(navigator.languages)
          ? navigator.languages
          : [navigator.language];

        for (var index = 0; index < browserLanguages.length; index += 1) {
          var browserLanguage = normalizeLanguage(browserLanguages[index]);
          if (browserLanguage) return browserLanguage;
        }

        return 'en';
      }

      function resolveSite() {
        var pathname = location.pathname;
        var site = 'official';

        if (pathname === '/search' || pathname.indexOf('/search/') === 0) {
          site = 'search';
        } else if (pathname === '/pricing' || pathname.indexOf('/pricing/') === 0) {
          site = 'pricing';
        }

        var labels = {
          official: 'Yume Official',
          search: 'Yume Search',
          pricing: 'Yume Pricing'
        };
        var home = site === 'search'
          ? '/search/'
          : site === 'pricing'
            ? '/pricing/'
            : '/';

        return { key: site, label: labels[site], home: home };
      }

      var language = resolveLanguage();
      var text = translations[language] || translations.en;
      var site = resolveSite();
      var homeText = text.home.replace('{site}', site.label);
      var displayedPath = location.pathname;

      try {
        displayedPath = decodeURI(displayedPath);
      } catch (error) {}

      document.documentElement.lang = language;
      document.title = text.pageTitle + ' · ' + site.label;
      document.getElementById('site-label').textContent = site.label;
      document.getElementById('error-eyebrow').textContent = text.eyebrow;
      document.getElementById('error-title').textContent = text.title;
      document.getElementById('error-description').textContent = text.description;
      document.getElementById('path-label').textContent = text.path;
      document.getElementById('request-path').textContent = displayedPath;

      var brandLink = document.getElementById('brand-link');
      brandLink.href = site.home;
      brandLink.setAttribute('aria-label', site.label);

      var homeLink = document.getElementById('home-link');
      homeLink.href = site.home;
      homeLink.textContent = homeText;

      var backButton = document.getElementById('back-button');
      backButton.textContent = text.back;
      if (history.length <= 1) {
        backButton.hidden = true;
      } else {
        backButton.addEventListener('click', function () {
          history.back();
        });
      }
    })();
  </script>
</body>
</html>
