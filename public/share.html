<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="darkreader-lock">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Yume Official Backend — Shared File</title>
  <script>try{var _b=JSON.parse(document.getElementById('branding-data')?.textContent||'{}');if(_b.siteName)document.title=_b.siteName+' — Shared File'}catch{}</script>
  <script src="/js/preferences.js?v=20260718.3"></script>
  <link rel="stylesheet" href="/css/tailwind.css?v=20260718.3">
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease-out; }
    .preview-container { background: var(--bg-primary); border-radius: 12px; overflow: hidden; max-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .preview-container img { max-width: 100%; max-height: 70vh; object-fit: contain; }
    .preview-container video, .preview-container audio { width: 100%; max-height: 70vh; }
    .preview-container iframe { width: 100%; height: 70vh; border: none; }
    .preview-container pre { width: 100%; max-height: 70vh; overflow: auto; padding: 20px; margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-primary); background: var(--bg-primary); }
    .copy-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0, 229, 255, 0.15); border: 1px solid var(--accent); color: white; padding: 10px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .copy-toast.show { opacity: 1; }
  </style>
  <link rel="stylesheet" href="/css/app.css?v=20260718.4">
</head>
<body style="font-family:var(--font-body)" class="min-h-screen flex flex-col" data-i18n-page="page.sharedFile">
<div class="page-background" data-darkreader-ignore aria-hidden="true">
  <img class="page-background-image" data-darkreader-ignore src="/img/yume-background.webp" alt="">
</div>
  <script id="file-data" type="application/json">{}</script>

  <header class="border-b border-[var(--border)] px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center gap-2">
      <img id="brand-bar-image" class="brand-bar-image" src="https://www.yume.zone/assets/img/yumeaio.png" alt="Yume Official Backend">
    </div>
  </header>

  <main class="flex-1 flex items-start justify-center p-4 pt-8">
    <div class="fade-up w-full max-w-4xl">

      <div id="password-gate" class="hidden max-w-sm mx-auto">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 text-center">
          <svg class="w-12 h-12 mx-auto mb-4 text-[var(--text-muted)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
          <h2 class="text-lg font-semibold text-[var(--text-primary)] mb-1" data-i18n="share.passwordProtected">Password Protected</h2>
          <p class="text-sm text-[var(--text-muted)] mb-4" data-i18n="share.enterPassword">Enter the password to access this file</p>
          <form id="password-form" method="POST">
            <input type="password" name="password" placeholder="Password" data-i18n-placeholder="ui.password" required autofocus class="w-full px-4 py-3 rounded-md bg-[var(--bg-tertiary)] border border-[var(--border-light)] text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-accent-400 mb-3">
            <div id="password-error" class="hidden text-red-400 text-sm mb-3"></div>
            <button type="submit" class="w-full py-3 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] font-medium transition-all" data-i18n="share.unlock">Unlock</button>
          </form>
        </div>
      </div>

      <div id="file-view" class="hidden">
        <div id="preview-area" class="preview-container mb-6"></div>

        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-5">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-md bg-[var(--bg-tertiary)] flex items-center justify-center text-2xl flex-shrink-0" id="file-icon"></div>
            <div class="flex-1 min-w-0">
              <h1 class="text-lg font-semibold text-[var(--text-primary)] truncate" id="file-name"></h1>
              <div class="flex flex-wrap items-center gap-3 mt-1 text-sm text-[var(--text-muted)]">
                <span id="file-size"></span>
                <span>&middot;</span>
                <span id="file-date"></span>
                <span>&middot;</span>
                <span id="file-downloads"></span>
              </div>
            </div>
          </div>

          <div class="flex gap-2 mt-5">
            <a id="download-btn" class="flex-1 flex items-center justify-center gap-2 py-3 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] font-medium transition-all text-center cursor-pointer">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              <span data-i18n="ui.download">Download</span>
            </a>
            <button id="copy-btn" class="px-4 py-3 rounded-md bg-[var(--bg-tertiary)] hover:bg-gray-700 text-gray-300 transition-all" data-i18n-title="ui.copyLink" data-i18n-aria-label="ui.copyLink" title="Copy link" aria-label="Copy link">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m9.86-2.03a4.5 4.5 0 00-1.242-7.244l-4.5-4.5a4.5 4.5 0 00-6.364 6.364L5.25 9.12"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="folder-view" class="hidden">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-5 mb-4">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-md bg-[var(--bg-tertiary)] flex items-center justify-center text-xl flex-shrink-0">📁</div>
            <div class="flex-1 min-w-0">
              <h1 class="text-lg font-semibold text-[var(--text-primary)] truncate" id="folder-title"></h1>
              <div id="folder-breadcrumb" class="flex items-center gap-1 mt-1 text-sm text-[var(--text-muted)] flex-wrap"></div>
            </div>
            <button id="folder-copy-btn" class="px-3 py-2 rounded-md bg-[var(--bg-tertiary)] hover:bg-gray-700 text-gray-300 transition-all text-sm" data-i18n-title="ui.copyLink" data-i18n-aria-label="ui.copyLink" title="Copy link" aria-label="Copy link">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m9.86-2.03a4.5 4.5 0 00-1.242-7.244l-4.5-4.5a4.5 4.5 0 00-6.364 6.364L5.25 9.12"/></svg>
            </button>
          </div>

          <div id="folder-subfolders" class="space-y-1 mb-3"></div>

          <div id="folder-files" class="space-y-1"></div>

          <div id="folder-empty" class="hidden text-center py-8">
            <p class="text-[var(--text-muted)] text-sm" data-i18n="share.emptyFolder">This folder is empty</p>
          </div>
        </div>
      </div>

      <div id="error-view" class="hidden max-w-sm mx-auto text-center">
        <svg class="w-16 h-16 mx-auto mb-4 text-[var(--text-muted)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
        <h2 class="text-xl font-semibold text-[var(--text-primary)] mb-2" data-i18n="share.fileNotAvailable">File Not Available</h2>
        <p class="text-[var(--text-muted)]" id="error-message" data-i18n="share.fileUnavailableHelp">This share link may have expired or been revoked.</p>
      </div>
    </div>
  </main>

  <footer id="footer" class="site-footer" data-yume-footer></footer>

  <div class="copy-toast" id="copy-toast" data-i18n="share.linkCopied">Link copied to clipboard</div>

  <script>
    (function() {
      try {
        var b = JSON.parse(document.getElementById('branding-data')?.textContent || '{}');
        var brandBar = document.getElementById('brand-bar-image');
        if (brandBar) {
          brandBar.src = b.logoBarImageUrl || 'https://www.yume.zone/assets/img/yumeaio.png';
          brandBar.alt = b.siteName || 'Yume Official Backend';
        }
      } catch {}
    })();
  </script>
  <script src="/js/i18n.js?v=20260718.4"></script>
  <script src="/js/share.js?v=20260718.3"></script>
</body>
</html>
