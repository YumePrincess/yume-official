<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="darkreader-lock">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <title>404 — Page Not Found</title>
  <script>try{var _b=JSON.parse(document.getElementById('branding-data')?.textContent||'{}');if(_b.siteName)document.title='404 — '+_b.siteName}catch{}</script>
  <script src="/js/preferences.js?v=20260718.3"></script>
  <link rel="stylesheet" href="/css/tailwind.css?v=20260718.3">
  <link rel="stylesheet" href="/css/app.css?v=20260718.4">
</head>
<body style="font-family:var(--font-body)" class="min-h-screen flex flex-col" data-i18n-page="notFound.title">
<div class="page-background" data-darkreader-ignore aria-hidden="true">
  <img class="page-background-image" data-darkreader-ignore src="/img/yume-background.webp" alt="">
</div>

  <header class="border-b border-[var(--border)] px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center gap-2">
      <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
        <img id="brand-bar-image" class="brand-bar-image" src="https://www.yume.zone/assets/img/yumeaio.png" alt="Yume Official Backend">
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4">
    <div class="text-center">
      <p class="text-7xl font-bold text-[var(--text-secondary)] mb-2">404</p>
      <p class="text-lg font-medium text-[var(--text-secondary)] mb-1" data-i18n="notFound.title">Page not found</p>
      <p class="text-sm text-[var(--text-muted)] mb-8" data-i18n="notFound.help">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        <span data-i18n="notFound.back">Back to Home</span>
      </a>
    </div>
  </main>

  <footer id="footer" class="site-footer" data-yume-footer></footer>

  <script src="/js/i18n.js?v=20260718.4"></script>
  <script>
    (function() {
      try {
        var b = JSON.parse(document.getElementById('branding-data')?.textContent || '{}');
        var brandBar = document.getElementById('brand-bar-image');
        if (brandBar) {
          brandBar.src = b.logoBarImageUrl || 'https://www.yume.zone/assets/img/yumeaio.png';
          brandBar.alt = b.siteName || 'Yume Official Backend';
        }
      } catch {}
    })();
  </script>
</body>
</html>
